fabrication: >
  Toon Studio a produit le décor et les calques, animé les gestes et le partage des morceaux, enregistré les prises françaises et composé la musique.
  Une vidéo Dr Healthcare a servi de référence de mise en scène. La production reprend des éléments de notre bibliothèque et deux nouveaux personnages.
