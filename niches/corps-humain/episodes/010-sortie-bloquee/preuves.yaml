fabrication: >
  Toon Studio a réemployé les personnages et le décor organique de sa bibliothèque,
  préparé les calques de la porte et des accessoires, animé les mains et les contacts,
  enregistré douze prises françaises et utilisé sa composition musicale de série.
  La vidéo fournie du 23 septembre 2025 sert de référence de mise en scène ; la consultation
  et les visuels sont réalisés dans notre univers. Les pièces décrivent la fabrication réelle.
