fabrication: >
  Toon Studio a conservé le casting approuvé, créé les illustrations manquantes avec Recraft,
  préparé la pose debout et les calques de la coupe, de la porte et des accessoires,
  animé les contacts, le glissement et les traces rouges, et utilisé treize prises françaises et sa musique de série.
  La vidéo fournie du 23 septembre 2025 sert de référence de mise en scène ; la consultation
  et les visuels sont réalisés dans notre univers. Les pièces décrivent la fabrication réelle.
